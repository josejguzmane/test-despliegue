# =============================================================================
# Validacion completa en main.
#
# Comprueba todas las fases de dev y prod con una identidad de solo lectura.
# Genera planes para verificar configuracion y deriva, pero nunca los aplica.
# =============================================================================
name: TF validation (main)

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'policy/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      terraform_version:
        description: 'Version de Terraform.'
        type: string
        default: 'latest'

concurrency:
  group: tf-validation-main
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: validate
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        environment: [dev, prod]
        phase:
          - 00-foundation
          - 10-network-hub
          - 20-network-spoke
          - 30-data
          - 40-aks
          - 50-edge
          - 60-observability
          - 70-security
    uses: ./.github/workflows/_terraform-phase.yml
    with:
      phase: ${{ matrix.phase }}
      tf_environment: ${{ matrix.environment }}
      terraform_version: ${{ inputs.terraform_version || 'latest' }}
    secrets: inherit
